<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Admin Dashboard — CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#e63946;--gold:#f4a261;--text:#f0f0f0;--muted:#888;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
    .sidebar{width:220px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 1rem;position:fixed;top:0;left:0;}
    .sidebar-brand{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--accent);letter-spacing:2px;margin-bottom:2rem;display:block;}
    .sidebar-brand span{color:var(--text);}
    .sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-radius:8px;color:var(--muted);font-weight:500;font-size:.9rem;text-decoration:none;margin-bottom:.3rem;transition:all .15s;}
    .sidebar-link:hover,.sidebar-link.active{background:rgba(230,57,70,.12);color:var(--text);}
    .sidebar-link i{width:16px;text-align:center;}
    .main{margin-left:220px;padding:2rem;}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;text-decoration:none;display:block;transition:border-color .2s;}
    .stat-card:hover{border-color:var(--accent);}
    .stat-value{font-family:'Bebas Neue',sans-serif;font-size:3rem;line-height:1;}
    .table-custom th{background:var(--surface);color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:1px;border-color:var(--border);}
    .table-custom td{border-color:var(--border);vertical-align:middle;font-size:.88rem;}
    .status-confirmed{color:#4caf50;} .status-cancelled{color:var(--muted);}
    .btn-accent{background:var(--accent);color:white;border:none;border-radius:6px;font-weight:600;padding:.4rem 1rem;text-decoration:none;display:inline-block;font-size:.88rem;}
  </style>
</head>
<body>
<div class="sidebar">
  <a href="/admin" class="sidebar-brand">CINE<span>BOOK</span></a>
  <a href="/admin" class="sidebar-link active"><i class="fa fa-gauge"></i>Dashboard</a>
  <a href="/admin/movies" class="sidebar-link"><i class="fa fa-film"></i>Movies</a>
  <a href="/admin/shows" class="sidebar-link"><i class="fa fa-calendar"></i>Shows</a>
  <a href="/admin/theatres" class="sidebar-link"><i class="fa fa-building"></i>Theatres</a>
  <a href="/admin/bookings" class="sidebar-link"><i class="fa fa-ticket"></i>Bookings</a>
  <a href="/admin/users" class="sidebar-link"><i class="fa fa-users"></i>Users</a>
  <hr style="border-color:var(--border);margin:1rem 0"/>
  <a href="/movies" class="sidebar-link"><i class="fa fa-arrow-left"></i>Back to Site</a>
</div>
<div class="main">
  <h2 class="section-title mb-4">DASHBOARD</h2>

  <!-- Stats -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <a href="/admin/movies" class="stat-card">
        <div style="color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:1px">Movies</div>
        <div class="stat-value" style="color:var(--accent)" th:text="${totalMovies}">0</div>
        <div style="color:var(--muted);font-size:.78rem">Click to manage →</div>
      </a>
    </div>
    <div class="col-md-3">
      <a href="/admin/shows" class="stat-card">
        <div style="color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:1px">Shows</div>
        <div class="stat-value" style="color:#a8dadc" th:text="${totalShows}">0</div>
        <div style="color:var(--muted);font-size:.78rem">Click to manage →</div>
      </a>
    </div>
    <div class="col-md-3">
      <a href="/admin/bookings" class="stat-card">
        <div style="color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:1px">Bookings</div>
        <div class="stat-value" style="color:var(--gold)" th:text="${totalBookings}">0</div>
        <div style="color:var(--muted);font-size:.78rem">Click to view →</div>
      </a>
    </div>
    <div class="col-md-3">
      <a href="/admin/users" class="stat-card">
        <div style="color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:1px">Users</div>
        <div class="stat-value" style="color:#9b5de5" th:text="${totalUsers}">0</div>
        <div style="color:var(--muted);font-size:.78rem">Click to manage →</div>
      </a>
    </div>
  </div>

  <!-- Recent Bookings -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="section-title" style="font-size:1.2rem">RECENT BOOKINGS</h5>
    <a href="/admin/bookings" class="btn-accent">View All</a>
  </div>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden">
    <table class="table table-custom mb-0">
      <thead>
        <tr>
          <th class="px-3 py-2">ID</th><th>User</th><th>Movie</th><th>Amount</th><th>Status</th><th>Date</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="b : ${recentBookings}">
          <td class="px-3" style="color:var(--muted)">#<span th:text="${b.id}"></span></td>
          <td th:text="${b.user.name}">User</td>
          <td th:text="${b.show.movie.title}">Movie</td>
          <td style="color:var(--gold)">₹<span th:text="${b.totalAmount}">0</span></td>
          <td><span th:classappend="${b.status.name()=='CONFIRMED'}?'status-confirmed':'status-cancelled'" th:text="${b.status}"></span></td>
          <td style="color:var(--muted)" th:text="${#temporals.format(b.bookingTime,'dd MMM HH:mm')}">Date</td>
        </tr>
        <tr th:if="${recentBookings.empty}">
          <td colspan="6" class="text-center py-4" style="color:var(--muted)">No bookings yet</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
