<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Booking Confirmed — CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#e63946;--gold:#f4a261;--text:#f0f0f0;--muted:#888;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .ticket-card{background:var(--card);border:1px solid var(--border);border-radius:20px;max-width:520px;width:100%;overflow:hidden;}
    .ticket-header{background:linear-gradient(135deg,#e63946,#c1121f);padding:2rem;text-align:center;}
    .ticket-body{padding:2rem;}
    .section-title{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;}
    .row-info{display:flex;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid var(--border);}
    .row-info:last-child{border-bottom:none;}
    .row-label{color:var(--muted);font-size:.85rem;}
    .row-value{font-weight:600;text-align:right;}
    .seat-chip{background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.3);color:var(--accent);border-radius:6px;padding:.2rem .5rem;font-size:.8rem;display:inline-block;margin:2px;}
    .divider-dashed{border:none;border-top:2px dashed var(--border);margin:1.2rem 0;}
    .btn-accent{background:var(--accent);color:white;border:none;border-radius:8px;font-weight:600;padding:.65rem 1.5rem;text-decoration:none;display:inline-block;}
    .btn-outline{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;padding:.65rem 1.5rem;text-decoration:none;display:inline-block;}
    .check-icon{font-size:2.5rem;margin-bottom:.5rem;}
  </style>
</head>
<body>
  <div class="ticket-card">
    <div class="ticket-header">
      <div class="check-icon">✅</div>
      <h3 class="section-title mb-1" style="font-size:1.8rem;letter-spacing:3px">BOOKING CONFIRMED!</h3>
      <p style="opacity:.85;font-size:.9rem">Your tickets are confirmed. Enjoy the show!</p>
    </div>

    <div class="ticket-body">
      <!-- Booking ID -->
      <div class="text-center mb-3">
        <span style="color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:1px">Booking ID</span>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--gold);letter-spacing:4px"
             th:text="'#' + ${booking.id}">
          #12345
        </div>
      </div>

      <hr class="divider-dashed"/>

      <div class="row-info">
        <span class="row-label">Movie</span>
        <span class="row-value" th:text="${booking.show.movie.title}">Title</span>
      </div>
      <div class="row-info">
        <span class="row-label">Theatre</span>
        <span class="row-value" th:text="${booking.show.theatre.name}">Theatre</span>
      </div>
      <div class="row-info">
        <span class="row-label">Date &amp; Time</span>
        <span class="row-value" th:text="${#temporals.format(booking.show.showTime, 'dd MMM yyyy, hh:mm a')}">Date</span>
      </div>
      <div class="row-info">
        <span class="row-label">Seats</span>
        <span class="row-value">
          <span th:each="ticket : ${booking.tickets}">
            <span class="seat-chip" th:text="${ticket.seatNumber}"></span>
          </span>
        </span>
      </div>
      <div class="row-info">
        <span class="row-label">Payment</span>
        <span class="row-value" th:text="${booking.paymentMethod}">UPI</span>
      </div>

      <hr class="divider-dashed"/>

      <div class="row-info" style="font-size:1.1rem">
        <span class="row-label" style="font-weight:700;color:var(--text)">Total Paid</span>
        <span class="row-value" style="color:var(--gold);font-size:1.3rem">
          ₹<span th:text="${booking.totalAmount}">500</span>
        </span>
      </div>

      <div class="d-flex gap-2 mt-4">
        <a href="/movies" class="btn-outline flex-fill text-center">← More Movies</a>
        <a href="/booking/history" class="btn-accent flex-fill text-center">My Bookings</a>
      </div>
    </div>
  </div>
</body>
</html>
