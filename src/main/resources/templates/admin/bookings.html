<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>All Bookings — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#e63946;--gold:#f4a261;--text:#f0f0f0;--muted:#888;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
    .sidebar{width:220px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 1rem;position:fixed;top:0;left:0;}
    .sidebar-brand{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--accent);letter-spacing:2px;margin-bottom:2rem;display:block;}
    .sidebar-brand span{color:var(--text);}
    .sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-radius:8px;color:var(--muted);font-weight:500;font-size:.9rem;text-decoration:none;margin-bottom:.3rem;transition:all .15s;}
    .sidebar-link:hover,.sidebar-link.active{background:rgba(230,57,70,.12);color:var(--text);}
    .sidebar-link i{width:16px;text-align:center;}
    .main{margin-left:220px;padding:2rem;}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;}
    .table-custom th{background:var(--surface);color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:1px;border-color:var(--border);}
    .table-custom td{border-color:var(--border);vertical-align:middle;font-size:.85rem;}
    .status-confirmed{color:#4caf50;}
    .status-cancelled{color:var(--muted);}
    .seat-chip{background:rgba(230,57,70,.1);color:var(--accent);border-radius:4px;padding:.1rem .4rem;font-size:.72rem;display:inline-block;margin:1px;}
  </style>
</head>
<body>
<div class="sidebar">
  <a href="/admin" class="sidebar-brand">CINE<span>BOOK</span></a>
  <a href="/admin" class="sidebar-link"><i class="fa fa-gauge"></i>Dashboard</a>
  <a href="/admin/movies" class="sidebar-link"><i class="fa fa-film"></i>Movies</a>
  <a href="/admin/shows" class="sidebar-link"><i class="fa fa-calendar"></i>Shows</a>
  <a href="/admin/bookings" class="sidebar-link active"><i class="fa fa-ticket"></i>Bookings</a>
  <a href="/admin/users" class="sidebar-link"><i class="fa fa-users"></i>Users</a>
  <hr style="border-color:var(--border);margin:1rem 0"/>
  <a href="/movies" class="sidebar-link"><i class="fa fa-arrow-left"></i>Back to Site</a>
</div>

<div class="main">
  <h2 class="section-title mb-4">ALL BOOKINGS</h2>

  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden">
    <table class="table table-custom mb-0">
      <thead>
        <tr>
          <th class="px-3 py-2">ID</th>
          <th>User</th>
          <th>Movie</th>
          <th>Theatre</th>
          <th>Show Time</th>
          <th>Seats</th>
          <th>Amount</th>
          <th>Payment</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="b : ${bookings}">
          <td class="px-3" style="color:var(--muted)">#<span th:text="${b.id}"></span></td>
          <td th:text="${b.user.name}">User</td>
          <td th:text="${b.show.movie.title}">Movie</td>
          <td th:text="${b.show.theatre.name}">Theatre</td>
          <td style="color:var(--muted)" th:text="${#temporals.format(b.show.showTime,'dd MMM HH:mm')}">Time</td>
          <td>
            <span th:each="t : ${b.tickets}" class="seat-chip" th:text="${t.seatNumber}"></span>
          </td>
          <td style="color:var(--gold);font-weight:600">₹<span th:text="${b.totalAmount}">0</span></td>
          <td style="color:var(--muted)" th:text="${b.paymentMethod}">UPI</td>
          <td>
            <span th:classappend="${b.status.name() == 'CONFIRMED'} ? 'status-confirmed' : 'status-cancelled'"
                  th:text="${b.status}">Status</span>
          </td>
        </tr>
        <tr th:if="${bookings.empty}">
          <td colspan="9" class="text-center py-4" style="color:var(--muted)">No bookings yet</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
