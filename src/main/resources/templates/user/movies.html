<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>Movies — CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#e63946;--gold:#f4a261;--text:#f0f0f0;--muted:#888;}
    *{box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
    .navbar{background:rgba(13,13,13,0.95);border-bottom:1px solid var(--border);padding:.8rem 2rem;position:sticky;top:0;z-index:100;}
    .navbar-brand{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--accent)!important;letter-spacing:2px;}
    .navbar-brand span{color:var(--text);}
    .nav-link{color:var(--muted)!important;font-weight:500;}
    .nav-link:hover{color:var(--text)!important;}
    .btn-accent{background:var(--accent);color:white;border:none;border-radius:6px;font-weight:600;padding:.4rem 1.1rem;}
    .btn-accent:hover{opacity:.85;color:white;}
    .hero{background:linear-gradient(135deg,#1a0a0e 0%,#0d0d0d 60%);padding:3rem 0 2rem;border-bottom:1px solid var(--border);}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px;}
    .movie-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .2s,box-shadow .2s;height:100%;}
    .movie-card:hover{transform:translateY(-6px);box-shadow:0 12px 40px rgba(230,57,70,.2);}
    .movie-card img{width:100%;height:300px;object-fit:cover;}
    .badge-genre{background:rgba(230,57,70,.15);color:var(--accent);border:1px solid rgba(230,57,70,.3);border-radius:20px;font-size:.72rem;font-weight:600;padding:.2rem .6rem;}
    .rating-badge{background:rgba(244,162,97,.12);color:var(--gold);border:1px solid rgba(244,162,97,.3);border-radius:4px;font-size:.78rem;padding:.15rem .5rem;}
    .search-input{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.55rem 1rem;}
    .search-input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px rgba(230,57,70,.2);}
    .genre-chip{background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:.3rem .9rem;font-size:.8rem;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-block;}
    .genre-chip:hover,.genre-chip.active{border-color:var(--accent);color:var(--accent);}
    .tag{display:inline-block;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:20px;font-size:.75rem;padding:.2rem .7rem;}
    .empty-state{text-align:center;padding:4rem 0;color:var(--muted);}
    .empty-state i{font-size:3rem;margin-bottom:1rem;display:block;}
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
  <a class="navbar-brand" href="/movies">CINE<span>BOOK</span></a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="nav">
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link active" href="/movies"><i class="fa fa-film me-1"></i>Movies</a></li>
      <li class="nav-item" sec:authorize="isAuthenticated()">
        <a class="nav-link" href="/booking/history"><i class="fa fa-ticket me-1"></i>My Bookings</a>
      </li>
      <li class="nav-item" sec:authorize="hasRole('ADMIN')">
        <a class="nav-link" href="/admin"><i class="fa fa-gauge me-1"></i>Admin</a>
      </li>
    </ul>
    <div class="d-flex gap-2 align-items-center">
      <span sec:authorize="isAuthenticated()" class="tag me-2">
        <i class="fa fa-user me-1"></i><span sec:authentication="name">User</span>
      </span>
      <a sec:authorize="!isAuthenticated()" href="/login" class="btn-accent btn">Login</a>
      <a sec:authorize="!isAuthenticated()" href="/register" class="btn btn-outline-secondary btn-sm">Register</a>
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
      </form>
    </div>
  </div>
</nav>

<!-- Hero / Search Bar -->
<div class="hero">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-6 mb-3 mb-md-0">
        <h1 class="section-title mb-1">NOW SHOWING</h1>
        <p style="color:var(--muted);">Book your favourite movies, anytime.</p>
      </div>
      <div class="col-md-6">
        <form th:action="@{/movies}" method="get" class="d-flex gap-2">
          <input type="text" name="search" class="search-input flex-grow-1"
                 placeholder="Search movies or genres…"
                 th:value="${search}"/>
          <button type="submit" class="btn-accent btn px-4">
            <i class="fa fa-search"></i>
          </button>
        </form>
      </div>
    </div>

    <!-- Genre chips -->
    <div class="mt-3 d-flex flex-wrap gap-2">
      <a href="/movies" class="genre-chip" th:classappend="${selectedGenre == null} ? 'active' : ''">All</a>
      <a th:each="g : ${genres}" th:href="@{/movies(genre=${g})}" class="genre-chip"
         th:classappend="${selectedGenre == g} ? 'active' : ''" th:text="${g}">Genre</a>
    </div>
  </div>
</div>

<!-- Movie Grid -->
<div class="container py-4">
  <div th:if="${movies.empty}" class="empty-state">
    <i class="fa fa-film"></i>
    <p>No movies found. Try a different search.</p>
    <a href="/movies" class="btn-accent btn mt-2">Browse All</a>
  </div>

  <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" th:unless="${movies.empty}">
    <div class="col" th:each="movie : ${movies}">
      <a th:href="@{/movies/{id}(id=${movie.id})}" class="text-decoration-none">
        <div class="movie-card">
          <img th:src="${movie.posterUrl}" th:alt="${movie.title}"
               onerror="this.src='https://via.placeholder.com/300x450/1e1e1e/e63946?text=No+Image'"/>
          <div class="p-3">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <span class="badge-genre" th:text="${movie.genre}">Genre</span>
              <span class="rating-badge"><i class="fa fa-star me-1"></i><span th:text="${movie.rating}">8.0</span></span>
            </div>
            <h6 class="mb-1 fw-600" style="color:var(--text)" th:text="${movie.title}">Title</h6>
            <small style="color:var(--muted)" th:text="${movie.language + ' • ' + movie.durationMinutes + ' min'}">Language</small>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
