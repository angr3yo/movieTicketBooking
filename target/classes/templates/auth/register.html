<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Register — CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg:#0d0d0d; --surface:#161616; --card:#1e1e1e; --border:#2a2a2a; --accent:#e63946; --text:#f0f0f0; --muted:#888; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .auth-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:2.5rem; width:100%; max-width:440px; }
    .brand { font-family:'Bebas Neue',sans-serif; font-size:2.2rem; color:var(--accent); letter-spacing:3px; }
    .brand span { color:var(--text); }
    .form-control { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; }
    .form-control:focus { background:var(--surface); border-color:var(--accent); color:var(--text); box-shadow:0 0 0 2px rgba(230,57,70,0.2); }
    .form-label { color:var(--muted); font-size:0.85rem; font-weight:500; }
    .btn-accent { background:var(--accent); color:white; border:none; border-radius:8px; font-weight:600; padding:0.65rem; width:100%; font-size:1rem; }
    .btn-accent:hover { opacity:0.9; color:white; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand">CINE<span>BOOK</span></div>
      <p style="color:var(--muted);font-size:0.9rem;">Create your account</p>
    </div>

    <div th:if="${error}"   class="alert alert-danger py-2 mb-3 small" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success py-2 mb-3 small" th:text="${success}"></div>

    <form th:action="@{/register}" method="post">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Arjun Kumar" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6"/>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirmPassword" class="form-control" placeholder="Repeat password" required/>
      </div>
      <button type="submit" class="btn-accent btn">Create Account</button>
    </form>

    <p class="text-center mt-3" style="font-size:0.9rem; color:var(--muted);">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>
</body>
</html>
