<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Login — CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg:#0d0d0d; --surface:#161616; --card:#1e1e1e; --border:#2a2a2a; --accent:#e63946; --text:#f0f0f0; --muted:#888; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px;
                 padding: 2.5rem; width: 100%; max-width: 420px; }
    .brand { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--accent); letter-spacing: 3px; }
    .brand span { color: var(--text); }
    .form-control { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; }
    .form-control:focus { background: var(--surface); border-color: var(--accent); color: var(--text); box-shadow: 0 0 0 2px rgba(230,57,70,0.2); }
    .form-label { color: var(--muted); font-size: 0.85rem; font-weight: 500; }
    .btn-accent { background: var(--accent); color: white; border: none; border-radius: 8px;
                  font-weight: 600; padding: 0.65rem; width: 100%; font-size: 1rem; }
    .btn-accent:hover { opacity: 0.9; color: white; }
    .divider { color: var(--muted); font-size: 0.8rem; text-align: center; position: relative; }
    .divider::before, .divider::after { content:''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border); }
    .divider::before { left: 0; } .divider::after { right: 0; }
    a { color: var(--accent); }
    .demo-box { background: rgba(230,57,70,0.08); border: 1px solid rgba(230,57,70,0.2); border-radius: 8px; padding: 0.8rem; font-size: 0.8rem; color: var(--muted); }
    .demo-box strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand">CINE<span>BOOK</span></div>
      <p style="color:var(--muted); font-size:0.9rem;">Sign in to your account</p>
    </div>

    <div th:if="${error}"   class="alert alert-danger py-2 mb-3 small" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success py-2 mb-3 small" th:text="${message}"></div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" name="username" class="form-control" placeholder="you@example.com" required/>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-accent btn">Sign In</button>
    </form>

    <div class="divider my-4">or</div>
    <p class="text-center" style="font-size:0.9rem; color:var(--muted);">
      Don't have an account? <a href="/register">Register</a>
    </p>

    <div class="demo-box mt-4">
      <div class="mb-1">🎬 Demo credentials:</div>
      <div><strong>Admin:</strong> <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="4726232a2e29072a28312e22346924282a">[email&#160;protected]</a> /
