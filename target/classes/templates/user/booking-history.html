<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>My Bookings — CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#e63946;--gold:#f4a261;--text:#f0f0f0;--muted:#888;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
    .navbar{background:rgba(13,13,13,.95);border-bottom:1px solid var(--border);padding:.8rem 2rem;position:sticky;top:0;z-index:100;}
    .navbar-brand{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--accent)!important;letter-spacing:2px;}
    .navbar-brand span{color:var(--text);}
    .nav-link{color:var(--muted)!important;font-weight:500;}
    .nav-link:hover{color:var(--text)!important;}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px;}
    .booking-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;transition:border-color .2s;}
    .booking-card:hover{border-color:var(--border);}
    .status-confirmed{color:#4caf50;background:rgba(76,175,80,.12);border:1px solid rgba(76,175,80,.25);border-radius:20px;padding:.2rem .7rem;font-size:.78rem;font-weight:600;}
    .status-cancelled{color:var(--muted);background:rgba(100,100,100,.12);border:1px solid rgba(100,100,100,.25);border-radius:20px;padding:.2rem .7rem;font-size:.78rem;font-weight:600;}
    .seat-chip{background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.25);color:var(--accent);border-radius:4px;padding:.1rem .4rem;font-size:.75rem;display:inline-block;margin:1px;}
    .btn-accent{background:var(--accent);color:white;border:none;border-radius:6px;font-weight:600;padding:.35rem 1rem;}
    .btn-outline-danger{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:.35rem 1rem;font-size:.85rem;}
    .empty-state{text-align:center;padding:5rem 0;color:var(--muted);}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <a class="navbar-brand" href="/movies">CINE<span>BOOK</span></a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="/movies">← Movies</a></li>
    </ul>
  </div>
</nav>

<div class="container py-5">
  <h2 class="section-title mb-4">MY BOOKINGS</h2>

  <div th:if="${message}" class="alert alert-info mb-3 small" th:text="${message}"></div>
  <div th:if="${error}"   class="alert alert-danger mb-3 small" th:text="${error}"></div>

  <div th:if="${bookings.empty}" class="empty-state">
    <i class="fa fa-ticket fa-3x mb-3 d-block"></i>
    <p>No bookings yet. Start by browsing movies!</p>
    <a href="/movies" class="btn-accent btn mt-2">Browse Movies</a>
  </div>

  <div class="row g-3" th:unless="${bookings.empty}">
    <div class="col-md-6" th:each="booking : ${bookings}">
      <div class="booking-card">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div>
            <h5 class="mb-0" th:text="${booking.show.movie.title}">Title</h5>
            <small style="color:var(--muted)" th:text="${booking.show.theatre.name}">Theatre</small>
          </div>
          <span th:if="${booking.status.name() == 'CONFIRMED'}" class="status-confirmed">✓ Confirmed</span>
          <span th:if="${booking.status.name() == 'CANCELLED'}" class="status-cancelled">✗ Cancelled</span>
        </div>

        <div class="mb-2" style="font-size:.85rem;color:var(--muted)">
          <i class="fa fa-calendar me-1"></i>
          <span th:text="${#temporals.format(booking.show.showTime,'dd MMM yyyy, hh:mm a')}"></span>
        </div>

        <div class="mb-3">
          <span th:each="ticket : ${booking.tickets}">
            <span class="seat-chip" th:text="${ticket.seatNumber}"></span>
          </span>
        </div>

        <div class="d-flex justify-content-between align-items-center">
          <span style="color:var(--gold);font-weight:700;font-size:1.1rem">
            ₹<span th:text="${booking.totalAmount}">500</span>
          </span>
          <div class="d-flex gap-2">
            <small style="color:var(--muted)" th:text="${booking.paymentMethod}">UPI</small>
            <form th:if="${booking.status.name() == 'CONFIRMED'}"
                  th:action="@{/booking/cancel/{id}(id=${booking.id})}" method="post"
                  onsubmit="return confirm('Cancel this booking?')">
              <button type="submit" class="btn-outline-danger btn btn-sm">Cancel</button>
            </form>
          </div>
        </div>
        <div style="color:var(--muted);font-size:.75rem;margin-top:.5rem">
          Booking ID: #<span th:text="${booking.id}"></span> &nbsp;|&nbsp;
          <span th:text="${#temporals.format(booking.bookingTime,'dd MMM yyyy HH:mm')}"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
