<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Theatres — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#e63946;--gold:#f4a261;--text:#f0f0f0;--muted:#888;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
    .sidebar{width:220px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 1rem;position:fixed;top:0;left:0;}
    .sidebar-brand{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--accent);letter-spacing:2px;margin-bottom:2rem;display:block;}
    .sidebar-brand span{color:var(--text);}
    .sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-radius:8px;color:var(--muted);font-weight:500;font-size:.9rem;text-decoration:none;margin-bottom:.3rem;transition:all .15s;}
    .sidebar-link:hover,.sidebar-link.active{background:rgba(230,57,70,.12);color:var(--text);}
    .main{margin-left:220px;padding:2rem;}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;}
    .form-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;}
    .form-control{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;}
    .form-control:focus{background:var(--surface);border-color:var(--accent);color:var(--text);box-shadow:none;}
    .form-label{color:var(--muted);font-size:.82rem;font-weight:500;}
    .btn-accent{background:var(--accent);color:white;border:none;border-radius:6px;font-weight:600;padding:.45rem 1.1rem;}
    .btn-accent:hover{opacity:.85;color:white;}
    .table-custom th{background:var(--surface);color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:1px;border-color:var(--border);}
    .table-custom td{border-color:var(--border);vertical-align:middle;font-size:.85rem;}
  </style>
</head>
<body>
<div class="sidebar">
  <a href="/admin" class="sidebar-brand">CINE<span>BOOK</span></a>
  <a href="/admin" class="sidebar-link"><i class="fa fa-gauge"></i>Dashboard</a>
  <a href="/admin/movies" class="sidebar-link"><i class="fa fa-film"></i>Movies</a>
  <a href="/admin/shows" class="sidebar-link"><i class="fa fa-calendar"></i>Shows</a>
  <a href="/admin/theatres" class="sidebar-link active"><i class="fa fa-building"></i>Theatres</a>
  <a href="/admin/bookings" class="sidebar-link"><i class="fa fa-ticket"></i>Bookings</a>
  <a href="/admin/users" class="sidebar-link"><i class="fa fa-users"></i>Users</a>
  <hr style="border-color:var(--border);margin:1rem 0"/>
  <a href="/movies" class="sidebar-link"><i class="fa fa-arrow-left"></i>Back to Site</a>
</div>
<div class="main">
  <h2 class="section-title mb-4">THEATRES</h2>

  <div th:if="${success}" class="alert alert-success small mb-3" th:text="${success}"></div>

  <!-- Add Theatre Form -->
  <div class="form-card mb-4">
    <h6 class="mb-3" style="color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-size:.8rem">Add New Theatre</h6>
    <form th:action="@{/admin/theatres/save}" method="post">
      <input type="hidden" name="id" value=""/>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Theatre Name</label>
          <input type="text" name="name" class="form-control" placeholder="e.g. PVR Cinemas - Forum Mall" required/>
        </div>
        <div class="col-md-3">
          <label class="form-label">Location</label>
          <input type="text" name="location" class="form-control" placeholder="e.g. Bengaluru" required/>
        </div>
        <div class="col-md-2">
          <label class="form-label">Total Seats</label>
          <input type="number" name="totalSeats" class="form-control" placeholder="120" min="10" required/>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" class="btn-accent btn"><i class="fa fa-plus me-1"></i>Add Theatre</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Theatres Table -->
  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden">
    <table class="table table-custom mb-0">
      <thead>
        <tr>
          <th class="px-3 py-2">ID</th>
          <th>Name</th>
          <th>Location</th>
          <th>Total Seats</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="theatre : ${theatres}">
          <td class="px-3" style="color:var(--muted)" th:text="${theatre.id}"></td>
          <td style="font-weight:600" th:text="${theatre.name}">Name</td>
          <td style="color:var(--muted)" th:text="${theatre.location}">Location</td>
          <td style="color:var(--gold)" th:text="${theatre.totalSeats}">0</td>
          <td>
            <form th:action="@{/admin/theatres/delete/{id}(id=${theatre.id})}" method="post"
                  style="display:inline" onsubmit="return confirm('Delete this theatre?')">
              <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
          </td>
        </tr>
        <tr th:if="${theatres.empty}">
          <td colspan="5" class="text-center py-4" style="color:var(--muted)">No theatres yet</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
