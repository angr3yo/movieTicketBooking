<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Movie Form — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#e63946;--text:#f0f0f0;--muted:#888;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
    .sidebar{width:220px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 1rem;position:fixed;top:0;left:0;}
    .sidebar-brand{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--accent);letter-spacing:2px;margin-bottom:2rem;display:block;}
    .sidebar-brand span{color:var(--text);}
    .sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-radius:8px;color:var(--muted);font-weight:500;font-size:.9rem;text-decoration:none;margin-bottom:.3rem;transition:all .15s;}
    .sidebar-link:hover{background:rgba(230,57,70,.12);color:var(--text);}
    .main{margin-left:220px;padding:2rem;}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;}
    .form-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2rem;max-width:680px;}
    .form-control,.form-select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;}
    .form-control:focus,.form-select:focus{background:var(--surface);border-color:var(--accent);color:var(--text);box-shadow:0 0 0 2px rgba(230,57,70,.2);}
    .form-label{color:var(--muted);font-size:.85rem;font-weight:500;}
    .btn-accent{background:var(--accent);color:white;border:none;border-radius:8px;font-weight:600;padding:.6rem 1.5rem;}
    .btn-accent:hover{opacity:.85;color:white;}
  </style>
</head>
<body>
<div class="sidebar">
  <a href="/admin" class="sidebar-brand">CINE<span>BOOK</span></a>
  <a href="/admin" class="sidebar-link"><i class="fa fa-gauge"></i>Dashboard</a>
  <a href="/admin/movies" class="sidebar-link active"><i class="fa fa-film"></i>Movies</a>
  <a href="/admin/shows" class="sidebar-link"><i class="fa fa-calendar"></i>Shows</a>
  <a href="/admin/theatres" class="sidebar-link"><i class="fa fa-building"></i>Theatres</a>
</div>

<div class="main">
  <h2 class="section-title mb-4" th:text="${movie.id != null} ? 'EDIT MOVIE' : 'ADD MOVIE'">Movie Form</h2>

  <div class="form-card">
    <form th:action="@{/admin/movies/save}" method="post" th:object="${movie}">
      <input type="hidden" th:field="*{id}"/>

      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Title *</label>
          <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Pushpa 2" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Genre *</label>
          <input type="text" th:field="*{genre}" class="form-control" placeholder="e.g. Action"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Language</label>
          <input type="text" th:field="*{language}" class="form-control" placeholder="e.g. Telugu"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Duration (minutes)</label>
          <input type="number" th:field="*{durationMinutes}" class="form-control" placeholder="120"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Rating (0-10)</label>
          <input type="number" th:field="*{rating}" step="0.1" min="0" max="10" class="form-control" placeholder="8.5"/>
        </div>
        <div class="col-12">
          <label class="form-label">Poster URL</label>
          <input type="text" th:field="*{posterUrl}" class="form-control" placeholder="https://..."/>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Movie description..."></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Status</label>
          <select th:field="*{status}" class="form-select">
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">Status</option>
          </select>
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn-accent btn">Save Movie</button>
        <a href="/admin/movies" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
