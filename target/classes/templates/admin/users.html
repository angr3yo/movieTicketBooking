<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Users — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#e63946;--gold:#f4a261;--text:#f0f0f0;--muted:#888;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
    .sidebar{width:220px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 1rem;position:fixed;top:0;left:0;}
    .sidebar-brand{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--accent);letter-spacing:2px;margin-bottom:2rem;display:block;}
    .sidebar-brand span{color:var(--text);}
    .sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-radius:8px;color:var(--muted);font-weight:500;font-size:.9rem;text-decoration:none;margin-bottom:.3rem;transition:all .15s;}
    .sidebar-link:hover,.sidebar-link.active{background:rgba(230,57,70,.12);color:var(--text);}
    .main{margin-left:220px;padding:2rem;}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;}
    .table-custom th{background:var(--surface);color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:1px;border-color:var(--border);}
    .table-custom td{border-color:var(--border);vertical-align:middle;font-size:.85rem;}
    .badge-admin{background:rgba(230,57,70,.15);color:var(--accent);border:1px solid rgba(230,57,70,.3);border-radius:20px;padding:.2rem .7rem;font-size:.72rem;font-weight:600;}
    .badge-user{background:rgba(168,218,220,.1);color:#a8dadc;border:1px solid rgba(168,218,220,.3);border-radius:20px;padding:.2rem .7rem;font-size:.72rem;font-weight:600;}
  </style>
</head>
<body>
<div class="sidebar">
  <a href="/admin" class="sidebar-brand">CINE<span>BOOK</span></a>
  <a href="/admin" class="sidebar-link"><i class="fa fa-gauge"></i>Dashboard</a>
  <a href="/admin/movies" class="sidebar-link"><i class="fa fa-film"></i>Movies</a>
  <a href="/admin/shows" class="sidebar-link"><i class="fa fa-calendar"></i>Shows</a>
  <a href="/admin/theatres" class="sidebar-link"><i class="fa fa-building"></i>Theatres</a>
  <a href="/admin/bookings" class="sidebar-link"><i class="fa fa-ticket"></i>Bookings</a>
  <a href="/admin/users" class="sidebar-link active"><i class="fa fa-users"></i>Users</a>
  <hr style="border-color:var(--border);margin:1rem 0"/>
  <a href="/movies" class="sidebar-link"><i class="fa fa-arrow-left"></i>Back to Site</a>
</div>
<div class="main">
  <h2 class="section-title mb-4">USERS</h2>

  <div th:if="${success}" class="alert alert-success small mb-3" th:text="${success}"></div>
  <div th:if="${error}"   class="alert alert-danger  small mb-3" th:text="${error}"></div>

  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden">
    <table class="table table-custom mb-0">
      <thead>
        <tr>
          <th class="px-3 py-2">ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="user : ${users}">
          <td class="px-3" style="color:var(--muted)" th:text="${user.id}"></td>
          <td style="font-weight:600" th:text="${user.name}">Name</td>
          <td style="color:var(--muted)" th:text="${user.email}">Email</td>
          <td>
            <span th:if="${user.role.name() == 'ADMIN'}" class="badge-admin">ADMIN</span>
            <span th:if="${user.role.name() == 'USER'}"  class="badge-user">USER</span>
          </td>
          <td>
            <form th:if="${user.role.name() == 'USER'}"
                  th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post"
                  style="display:inline" onsubmit="return confirm('Delete this user?')">
              <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
            <span th:if="${user.role.name() == 'ADMIN'}" style="color:var(--muted);font-size:.78rem">Protected</span>
          </td>
        </tr>
        <tr th:if="${users.empty}">
          <td colspan="5" class="text-center py-4" style="color:var(--muted)">No users found</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
