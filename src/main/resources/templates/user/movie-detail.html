<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${movie.title + ' — CineBook'}">Movie — CineBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#e63946;--gold:#f4a261;--text:#f0f0f0;--muted:#888;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
    .navbar{background:rgba(13,13,13,0.95);border-bottom:1px solid var(--border);padding:.8rem 2rem;position:sticky;top:0;z-index:100;}
    .navbar-brand{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--accent)!important;letter-spacing:2px;}
    .navbar-brand span{color:var(--text);}
    .nav-link{color:var(--muted)!important;font-weight:500;}
    .nav-link:hover{color:var(--text)!important;}
    .btn-accent{background:var(--accent);color:white;border:none;border-radius:6px;font-weight:600;padding:.4rem 1.1rem;}
    .btn-accent:hover{opacity:.85;color:white;}
    .movie-poster{width:100%;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:2px;}
    .badge-genre{background:rgba(230,57,70,.15);color:var(--accent);border:1px solid rgba(230,57,70,.3);border-radius:20px;font-size:.78rem;font-weight:600;padding:.25rem .8rem;}
    .rating-badge{background:rgba(244,162,97,.12);color:var(--gold);border:1px solid rgba(244,162,97,.3);border-radius:6px;padding:.3rem .7rem;font-weight:600;}
    .show-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.2rem;transition:border-color .2s;}
    .show-card:hover{border-color:var(--accent);}
    .show-time{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:1px;color:var(--text);}
    .show-price{color:var(--gold);font-weight:600;font-size:1.1rem;}
    .tag{display:inline-block;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:20px;font-size:.75rem;padding:.2rem .7rem;}
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <a class="navbar-brand" href="/movies">CINE<span>BOOK</span></a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="/movies">← Back to Movies</a></li>
    </ul>
    <div class="d-flex gap-2">
      <a sec:authorize="!isAuthenticated()" href="/login" class="btn-accent btn">Login</a>
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
      </form>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row g-5">
    <!-- Poster -->
    <div class="col-md-3">
      <img class="movie-poster" th:src="${movie.posterUrl}" th:alt="${movie.title}"
           onerror="this.src='https://via.placeholder.com/300x450/1e1e1e/e63946?text=No+Image'"/>
    </div>

    <!-- Movie Info -->
    <div class="col-md-9">
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <span class="badge-genre" th:text="${movie.genre}">Genre</span>
        <span class="tag" th:text="${movie.language}">Language</span>
        <span class="tag"><i class="fa fa-clock me-1"></i><span th:text="${movie.durationMinutes + ' min'}"></span></span>
        <span class="rating-badge"><i class="fa fa-star me-1"></i><span th:text="${movie.rating}">8.0</span></span>
      </div>

      <h1 style="font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:2px;line-height:1" th:text="${movie.title}">Title</h1>
      <p class="mt-3" style="color:var(--muted);line-height:1.7" th:text="${movie.description}">Description</p>

      <!-- Shows -->
      <div class="mt-4">
        <h4 class="section-title mb-3">SELECT A SHOW</h4>

        <div th:if="${shows.empty}" class="text-center py-4" style="color:var(--muted)">
          <i class="fa fa-calendar-xmark fa-2x mb-2 d-block"></i>
          No available shows at the moment.
        </div>

        <div class="row g-3" th:unless="${shows.empty}">
          <div class="col-md-4" th:each="show : ${shows}">
            <div class="show-card">
              <div class="show-time" th:text="${#temporals.format(show.showTime, 'hh:mm a')}">Time</div>
              <div style="color:var(--muted);font-size:.8rem;" th:text="${#temporals.format(show.showTime, 'dd MMM yyyy')}">Date</div>
              <div class="mt-2" style="font-size:.85rem;color:var(--muted)" th:text="${show.theatre.name}">Theatre</div>
              <div class="d-flex justify-content-between align-items-center mt-3">
                <span class="show-price">₹<span th:text="${show.ticketPrice}">250</span></span>
                <span style="font-size:.78rem;color:var(--muted)">
                  <i class="fa fa-chair me-1"></i><span th:text="${show.availableSeats}">100</span> left
                </span>
              </div>
              <a sec:authorize="isAuthenticated()"
                 th:href="@{/booking/select-seats/{id}(id=${show.id})}"
                 class="btn-accent btn w-100 mt-3 text-center">Book Now</a>
              <a sec:authorize="!isAuthenticated()" href="/login"
                 class="btn-accent btn w-100 mt-3 text-center">Login to Book</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
