<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Manage Movies — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#e63946;--gold:#f4a261;--text:#f0f0f0;--muted:#888;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
    .sidebar{width:220px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 1rem;position:fixed;top:0;left:0;}
    .sidebar-brand{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--accent);letter-spacing:2px;margin-bottom:2rem;display:block;}
    .sidebar-brand span{color:var(--text);}
    .sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-radius:8px;color:var(--muted);font-weight:500;font-size:.9rem;text-decoration:none;margin-bottom:.3rem;transition:all .15s;}
    .sidebar-link:hover,.sidebar-link.active{background:rgba(230,57,70,.12);color:var(--text);}
    .sidebar-link i{width:16px;text-align:center;}
    .main{margin-left:220px;padding:2rem;}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;}
    .btn-accent{background:var(--accent);color:white;border:none;border-radius:6px;font-weight:600;padding:.4rem 1rem;text-decoration:none;display:inline-block;font-size:.88rem;}
    .btn-accent:hover{opacity:.85;color:white;}
    .table-custom th{background:var(--surface);color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:1px;border-color:var(--border);}
    .table-custom td{border-color:var(--border);vertical-align:middle;font-size:.88rem;}
    .badge-status{border-radius:20px;padding:.2rem .7rem;font-size:.72rem;font-weight:600;}
    .badge-now{background:rgba(76,175,80,.15);color:#4caf50;border:1px solid rgba(76,175,80,.3);}
    .badge-soon{background:rgba(244,162,97,.15);color:var(--gold);border:1px solid rgba(244,162,97,.3);}
    .badge-ended{background:rgba(100,100,100,.15);color:var(--muted);border:1px solid rgba(100,100,100,.3);}
  </style>
</head>
<body>
<div class="sidebar">
  <a href="/admin" class="sidebar-brand">CINE<span>BOOK</span></a>
  <a href="/admin" class="sidebar-link"><i class="fa fa-gauge"></i>Dashboard</a>
  <a href="/admin/movies" class="sidebar-link active"><i class="fa fa-film"></i>Movies</a>
  <a href="/admin/shows" class="sidebar-link"><i class="fa fa-calendar"></i>Shows</a>
  <a href="/admin/theatres" class="sidebar-link"><i class="fa fa-building"></i>Theatres</a>
  <a href="/admin/bookings" class="sidebar-link"><i class="fa fa-ticket"></i>Bookings</a>
  <a href="/admin/users" class="sidebar-link"><i class="fa fa-users"></i>Users</a>
  <hr style="border-color:var(--border);margin:1rem 0"/>
  <a href="/movies" class="sidebar-link"><i class="fa fa-arrow-left"></i>Back to Site</a>
</div>

<div class="main">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="section-title">MOVIES</h2>
    <a href="/admin/movies/add" class="btn-accent btn"><i class="fa fa-plus me-1"></i>Add Movie</a>
  </div>

  <div th:if="${success}" class="alert alert-success small mb-3" th:text="${success}"></div>

  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden">
    <table class="table table-custom mb-0">
      <thead>
        <tr>
          <th class="px-3 py-2">ID</th>
          <th>Title</th>
          <th>Genre</th>
          <th>Language</th>
          <th>Duration</th>
          <th>Rating</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="movie : ${movies}">
          <td class="px-3" style="color:var(--muted)" th:text="${movie.id}"></td>
          <td style="font-weight:600" th:text="${movie.title}">Title</td>
          <td style="color:var(--muted)" th:text="${movie.genre}">Genre</td>
          <td style="color:var(--muted)" th:text="${movie.language}">Lang</td>
          <td style="color:var(--muted)" th:text="${movie.durationMinutes + ' min'}">120 min</td>
          <td style="color:var(--gold)" th:text="${movie.rating}">8.0</td>
          <td>
            <span th:if="${movie.status.name() == 'NOW_SHOWING'}" class="badge-status badge-now">Now Showing</span>
            <span th:if="${movie.status.name() == 'COMING_SOON'}" class="badge-status badge-soon">Coming Soon</span>
            <span th:if="${movie.status.name() == 'ENDED'}"       class="badge-status badge-ended">Ended</span>
          </td>
          <td>
            <a th:href="@{/admin/movies/edit/{id}(id=${movie.id})}" class="btn btn-sm btn-outline-secondary me-1">Edit</a>
            <form th:action="@{/admin/movies/delete/{id}(id=${movie.id})}" method="post" style="display:inline"
                  onsubmit="return confirm('Delete this movie?')">
              <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
          </td>
        </tr>
        <tr th:if="${movies.empty}">
          <td colspan="8" class="text-center py-4" style="color:var(--muted)">No movies found</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
